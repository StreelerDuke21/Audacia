<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bird Flight – Prototipo Web</title>
  <link rel="stylesheet" href="css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.17.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.17.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.17.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
</head>
<body>
  <div id="app">
    <video id="video" playsinline muted></video>
    <canvas id="c3d"></canvas>

    <div id="posePanel">
      <canvas id="poseCanvas" width="320" height="240"></canvas>
      <div id="poseLabel">Body Tracking</div>
    </div>

    <div id="ui">
      <div id="status">Iniciando...</div>
      <div id="action">ACCIÓN: ---</div>
      <div id="debug"></div>
      <div id="hint">Espacio / manos en cabeza = pausa · Optimizado</div>
    </div>

    <div id="pauseOverlay">
      <div class="box">
        <h1>PAUSA</h1>
        <p>Espacio o ambas manos en la cabeza para continuar</p>
      </div>
    </div>

    <div id="scoreboard">
      <div class="score-line">Aros: <span id="ringScore">0</span></div>
      <div class="score-line record">Récord: <span id="bestScore">0</span></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/pose.js"></script>
  <script src="js/bird.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
